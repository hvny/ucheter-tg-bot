services:
  db:
    image: postgres:17-alpine
    container_name: ucheter-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucheter-bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 снаружи, т.к. на 5432 хоста уже висит локальный PostgreSQL
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ucheter-bot']
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: ucheter-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY}
      DATABASE_URL: postgres://postgres:postgres@db:5432/ucheter-bot

volumes:
  pgdata:
