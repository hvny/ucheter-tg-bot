services:
  db:
    image: postgres:17-alpine
    container_name: ucheter-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucheter-bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 снаружи, т.к. на 5432 хоста уже висит локальный PostgreSQL
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ucheter-bot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
